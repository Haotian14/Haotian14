<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Hart — frontend engineer and systems builder</title>
  <desc id="desc">An editorial profile banner mapping Hart's work from interfaces through services and runtimes to intelligent agents.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#71807B" stroke-opacity=".055"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L8 4 0 8Z" fill="#F0B45A"/>
    </marker>
  </defs>

  <rect width="1200" height="380" rx="16" fill="#090D0C"/>
  <rect width="1200" height="380" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="#3A4743"/>

  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <text x="48" y="48" fill="#F0B45A" font-size="12" font-weight="700" letter-spacing="2">01 / PROFILE</text>
    <line x1="48" y1="64" x2="430" y2="64" stroke="#4B5753"/>
    <text x="48" y="172" fill="#F4F0E6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="96" font-weight="800" letter-spacing="-5">HART</text>
    <text x="52" y="208" fill="#5ECFC0" font-size="13" font-weight="700" letter-spacing="2">FRONTEND ENGINEER / SYSTEMS BUILDER</text>
    <text x="52" y="250" fill="#C7CEC9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">I turn ambitious ideas into working systems.</text>
    <text x="52" y="278" fill="#82908B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Readable interfaces. Reliable services. Curious experiments.</text>

    <line x1="48" y1="318" x2="430" y2="318" stroke="#303C38"/>
    <text x="48" y="343" fill="#71807B" font-size="10" letter-spacing="1.4">NOW</text>
    <text x="91" y="343" fill="#E6E1D7" font-size="11" font-weight="700">HITHINK / FRONTEND</text>
    <text x="276" y="343" fill="#71807B" font-size="10" letter-spacing="1.4">EDU</text>
    <text x="315" y="343" fill="#E6E1D7" font-size="11" font-weight="700">UNSW / BSC + MSC</text>
  </g>

  <line x1="468" y1="34" x2="468" y2="346" stroke="#3A4743"/>

  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <text x="510" y="48" fill="#82908B" font-size="11" letter-spacing="1.8">BUILD PATH / 04 LAYERS</text>
    <text x="1128" y="48" text-anchor="end" fill="#F0B45A" font-size="10" letter-spacing="1.3">SYSTEM ATLAS</text>
    <line x1="510" y1="64" x2="1128" y2="64" stroke="#4B5753"/>

    <path d="M542 190H1134" fill="none" stroke="#596661" stroke-width="1.5" marker-end="url(#arrow)"/>

    <g transform="translate(586 190)">
      <rect x="-42" y="-57" width="84" height="60" rx="5" fill="#0D1412" stroke="#D8D2C7"/>
      <line x1="-42" y1="-39" x2="42" y2="-39" stroke="#596661"/>
      <circle cx="-30" cy="-48" r="2.5" fill="#F0B45A"/>
      <circle cx="-20" cy="-48" r="2.5" fill="#5ECFC0"/>
      <rect x="-29" y="-28" width="25" height="18" fill="none" stroke="#71807B"/>
      <path d="M7-27H29M7-19H25M7-11H20" stroke="#71807B"/>
      <circle r="5" fill="#5ECFC0"/>
      <text y="36" text-anchor="middle" fill="#5ECFC0" font-size="13" font-weight="700" letter-spacing="1.5">INTERFACE</text>
      <text y="56" text-anchor="middle" fill="#71807B" font-size="9" letter-spacing="1">UI / UX / DX</text>
    </g>

    <g transform="translate(760 190)">
      <path d="M0-58L43-33V17L0 42-43 17V-33Z" fill="#0D1412" stroke="#D8D2C7"/>
      <path d="M-17-17L0-27 17-17 0-7ZM-17 5L0-5 17 5 0 15Z" fill="none" stroke="#71807B"/>
      <circle r="5" fill="#5ECFC0"/>
      <text y="74" text-anchor="middle" fill="#5ECFC0" font-size="13" font-weight="700" letter-spacing="1.5">SERVICE</text>
      <text y="94" text-anchor="middle" fill="#71807B" font-size="9" letter-spacing="1">API / LOGIC / DATA</text>
    </g>

    <g transform="translate(936 190)">
      <circle cy="-10" r="44" fill="#0D1412" stroke="#D8D2C7"/>
      <circle cy="-10" r="22" fill="none" stroke="#71807B" stroke-dasharray="3 4"/>
      <path d="M0-62V-54M0 34V42M-52-10H-44M44-10H52M-37-47L-31-41M31 21L37 27M37-47L31-41M-31 21L-37 27" stroke="#F0B45A" stroke-width="2"/>
      <circle r="5" fill="#5ECFC0"/>
      <text y="74" text-anchor="middle" fill="#5ECFC0" font-size="13" font-weight="700" letter-spacing="1.5">RUNTIME</text>
      <text y="94" text-anchor="middle" fill="#71807B" font-size="9" letter-spacing="1">EXECUTION / EVENTS</text>
    </g>

    <g transform="translate(1102 190)">
      <circle cy="-10" r="48" fill="#0D1412" stroke="#D8D2C7" stroke-dasharray="4 4"/>
      <circle cy="-10" r="25" fill="none" stroke="#71807B"/>
      <circle cy="-10" r="11" fill="#5ECFC0" fill-opacity=".8"/>
      <circle cy="-58" r="4" fill="#F0B45A"/>
      <circle r="5" fill="#5ECFC0"/>
      <text y="74" text-anchor="middle" fill="#5ECFC0" font-size="13" font-weight="700" letter-spacing="1.5">AGENT</text>
      <text y="94" text-anchor="middle" fill="#71807B" font-size="9" letter-spacing="1">GOALS / ACTIONS</text>
    </g>
  </g>
</svg>
