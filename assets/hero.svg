<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Hart — Frontend Engineer and Systems Builder</title>
  <desc id="desc">A dark gradient profile banner with a code-inspired systems diagram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B18"/>
      <stop offset="0.5" stop-color="#11172B"/>
      <stop offset="1" stop-color="#071B26"/>
    </linearGradient>
    <linearGradient id="accent" x1="86" y1="90" x2="770" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="0.48" stop-color="#6D5EF5"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#18213B" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#0B1222" stop-opacity="0.94"/>
    </linearGradient>
    <radialGradient id="glowPurple">
      <stop stop-color="#8B5CF6" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan">
      <stop stop-color="#22D3EE" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#94A3B8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000814" flood-opacity="0.48"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="222" cy="68" r="240" fill="url(#glowPurple)"/>
  <circle cx="1090" cy="338" r="270" fill="url(#glowCyan)"/>

  <g transform="translate(74 62)">
    <rect width="294" height="34" rx="17" fill="#7C3AED" fill-opacity="0.17" stroke="#A78BFA" stroke-opacity="0.55"/>
    <circle cx="18" cy="17" r="5" fill="#22D3EE"/>
    <text x="34" y="22" fill="#D8D5FF" font-size="13" font-weight="700" letter-spacing="1.7" font-family="Inter,Segoe UI,Arial,sans-serif">FRONTEND ENGINEER · SYSTEMS BUILDER</text>

    <text x="0" y="148" fill="#F8FAFC" font-size="92" font-weight="800" letter-spacing="-4" font-family="Inter,Segoe UI,Arial,sans-serif">HART</text>
    <rect y="169" width="408" height="6" rx="3" fill="url(#accent)"/>

    <text x="2" y="218" fill="#CBD5E1" font-size="22" font-weight="600" font-family="Inter,Segoe UI,Arial,sans-serif">I turn ambitious ideas into working systems.</text>
    <text x="2" y="255" fill="#7DD3FC" font-size="15" font-weight="700" letter-spacing="2" font-family="Inter,Segoe UI,Arial,sans-serif">AI TOOLING  /  DISTRIBUTED SYSTEMS  /  MODERN WEB</text>

    <g transform="translate(2 278)">
      <rect width="114" height="34" rx="17" fill="#111827" stroke="#334155"/>
      <text x="57" y="22" text-anchor="middle" fill="#E2E8F0" font-size="13" font-weight="600" font-family="Inter,Segoe UI,Arial,sans-serif">UNSW BSc + MSc</text>
      <rect x="126" width="156" height="34" rx="17" fill="#111827" stroke="#334155"/>
      <text x="204" y="22" text-anchor="middle" fill="#E2E8F0" font-size="13" font-weight="600" font-family="Inter,Segoe UI,Arial,sans-serif">Hithink · Frontend</text>
    </g>
  </g>

  <g transform="translate(720 58)" filter="url(#shadow)">
    <rect width="410" height="304" rx="22" fill="url(#panel)" stroke="#475569" stroke-opacity="0.62"/>
    <rect width="410" height="48" rx="22" fill="#1E293B"/>
    <path d="M0 26Q0 0 26 0H384Q410 0 410 26V48H0Z" fill="#1E293B"/>
    <circle cx="26" cy="24" r="5" fill="#FB7185"/>
    <circle cx="44" cy="24" r="5" fill="#FBBF24"/>
    <circle cx="62" cy="24" r="5" fill="#34D399"/>
    <text x="205" y="29" text-anchor="middle" fill="#94A3B8" font-size="12" letter-spacing="1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">hart.system</text>

    <g transform="translate(30 82)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">
      <text y="0" fill="#64748B">01</text><text x="38" y="0" fill="#C4B5FD">const</text><text x="88" y="0" fill="#E2E8F0"> focus </text><text x="146" y="0" fill="#94A3B8">=</text><text x="166" y="0" fill="#67E8F9">[</text>
      <text x="48" y="34" fill="#64748B">02</text><text x="86" y="34" fill="#F8FAFC">"MCP &amp; AI agents",</text>
      <text x="48" y="68" fill="#64748B">03</text><text x="86" y="68" fill="#F8FAFC">"runtime tooling",</text>
      <text x="48" y="102" fill="#64748B">04</text><text x="86" y="102" fill="#F8FAFC">"real-time web"</text>
      <text x="48" y="136" fill="#64748B">05</text><text x="86" y="136" fill="#67E8F9">]</text>
      <text x="48" y="184" fill="#64748B">06</text><text x="86" y="184" fill="#C4B5FD">status</text><text x="140" y="184" fill="#94A3B8">:</text><text x="156" y="184" fill="#86EFAC">"shipping"</text>
    </g>

    <g transform="translate(280 242)">
      <path d="M0 18H26L42 0H68L82 18H104" fill="none" stroke="url(#accent)" stroke-width="2"/>
      <circle cx="0" cy="18" r="5" fill="#A78BFA"/>
      <circle cx="42" cy="0" r="5" fill="#818CF8"/>
      <circle cx="82" cy="18" r="5" fill="#22D3EE"/>
      <circle cx="104" cy="18" r="5" fill="#67E8F9"/>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#94A3B8" stroke-opacity="0.2"/>
</svg>
