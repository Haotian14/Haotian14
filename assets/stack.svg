      <line y1="17" x2="320" y2="17" stroke="#2E625C"/>
      <g fill="#E6E1D7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">
        <text y="54">TypeScript</text><text x="178" y="54">Python</text>
        <text y="88">JavaScript</text><text x="178" y="88">C++</text>
        <text y="122">Java</text><text x="178" y="122">C#</text>
        <text y="156">Solidity</text>
