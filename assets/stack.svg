<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="286" viewBox="0 0 1200 286" role="img" aria-labelledby="title desc">
  <title id="title">Hart's technology toolbox</title>
  <desc id="desc">A scan-friendly capability matrix covering languages, interfaces, and systems and AI tools.</desc>
  <rect width="1200" height="286" rx="14" fill="#090D0C"/>
  <rect x="1" y="1" width="1198" height="284" rx="13" fill="none" stroke="#3A4743"/>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <text x="42" y="43" fill="#F0B45A" font-size="11" font-weight="700" letter-spacing="1.8">03 / TOOLBOX</text>
    <text x="1158" y="43" text-anchor="end" fill="#71807B" font-size="10" letter-spacing="1.3">CAPABILITY MAP / 19 TOOLS</text>
    <line x1="42" y1="58" x2="1158" y2="58" stroke="#46534F"/>

    <line x1="402" y1="82" x2="402" y2="246" stroke="#34403C"/>
    <line x1="800" y1="82" x2="800" y2="246" stroke="#34403C"/>

    <g transform="translate(42 92)">
