      <line y1="17" x2="318" y2="17" stroke="#2E625C"/>
      <g fill="#E6E1D7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">
        <text y="54">React</text><text x="174" y="54">Vue 3</text>
        <text y="88">Vite</text><text x="174" y="88">WebSocket</text>
        <text y="122">Node.js</text><text x="174" y="122">Real-time UI</text>
