name: Generate Themed Contribution Snake

on:
  schedule:
    # Refresh twice a day so the profile stays current.
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile source
        uses: actions/checkout@v4

      - name: Generate violet and cyan snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            tmp/github-snake.svg?palette=github-light&color_snake=#7C3AED&color_dots=#F1F5F9,#DDD6FE,#A78BFA,#6D5EF5,#0891B2
            tmp/github-snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#161B22,#18213B,#312E81,#7C3AED,#22D3EE

      - name: Build the custom contribution panels
        run: |
          node scripts/theme-snake.mjs tmp/github-snake.svg dist/github-snake.svg light
          node scripts/theme-snake.mjs tmp/github-snake-dark.svg dist/github-snake-dark.svg dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
