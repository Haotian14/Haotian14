name: Generate Themed Contribution Snake

on:
  schedule:
    # Refresh twice a day so the profile stays current.
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify the SVG generator
        run: npm test

      - name: Generate contribution activity SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            tmp/github-snake.svg?palette=github-light&color_snake=#B76D17&color_dots=#ECE9E0,#C8E6DF,#82CFC1,#2D9C8F,#087F75
            tmp/github-snake-dark.svg?palette=github-dark&color_snake=#F0B45A&color_dots=#151B19,#183B36,#21675F,#36998D,#5ECFC0

      - name: Build the custom contribution panels
        run: |
          node scripts/build-snake.mjs tmp/github-snake.svg dist/github-snake.svg light
          node scripts/build-snake.mjs tmp/github-snake-dark.svg dist/github-snake-dark.svg dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
